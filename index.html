<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Maker Faire</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 2rem;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p.subtitle {
            font-size: 1.1rem;
            color: #aaa;
            margin-bottom: 3rem;
        }
        .games {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        a.card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 280px;
            height: 200px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            text-decoration: none;
            color: #fff;
            transition: transform 0.2s, background 0.2s;
            padding: 1.5rem;
            text-align: center;
        }
        a.card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.1);
        }
        .card .icon { font-size: 3rem; margin-bottom: 1rem; }
        .card .label { font-size: 1.2rem; font-weight: 600; }
    </style>
</head>
<body>
    <h1>2026 Maker Faire</h1>
    <p class="subtitle">Kids' Game Projects</p>
    <div class="games">
        <a class="card" href="3D Connect Four.html">
            <div class="icon">🔴🟡</div>
            <div class="label">3D Connect Four</div>
        </a>
        <a class="card" href="Space Trivia Challenge - AI Edition.html">
            <div class="icon">🚀🌌</div>
            <div class="label">Space Trivia Challenge</div>
        </a>
    </div>
</body>
</html>
